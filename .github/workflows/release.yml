name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the overlay
        run: ./scripts/verify.sh
      - name: Package the source and patches
        run: ./scripts/package.sh "${GITHUB_REF_NAME}"
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
